services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: biodiversity
      POSTGRES_USER: biodiversity
      POSTGRES_PASSWORD: biodiversity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biodiversity -d biodiversity"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

