services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: listening_bio
      POSTGRES_USER: listening_bio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listening_bio -d listening_bio"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &app_environment
      APP_NAME: Listening.bio Evidence API
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://listening_bio:${POSTGRES_PASSWORD}@postgres:5432/listening_bio
      UPLOAD_DIR: /app/work/uploads
      BIRDNET_MIN_CONFIDENCE: ${BIRDNET_MIN_CONFIDENCE:-0.25}
    command: ["alembic", "-c", "database/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *app_environment
    volumes:
      - audio_uploads:/app/work/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - private
      - proxy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app_environment
      WORKER_POLL_SECONDS: 5
      WORKER_BATCH_SIZE: 2
    volumes:
      - audio_uploads:/app/work/uploads
    command: ["python", "-m", "backend.app.workers.worker_loop"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - private

volumes:
  postgres_data:
  audio_uploads:

networks:
  private:
    internal: true
  proxy:
